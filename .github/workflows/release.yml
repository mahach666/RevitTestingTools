name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Trusted Publishing nuget.org: OIDC-токен меняется на временный API-ключ

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-release-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'build/RevitVersion.props') }}
          restore-keys: ${{ runner.os }}-nuget-release-

      - name: Build
        run: dotnet build RevitTestingTools.sln -c Release

      - name: Test
        run: dotnet test RevitTestingTools.sln -c Release --no-build

      - name: Pack
        shell: pwsh
        run: ./tools/pack-release.ps1

      # Черновик с пометкой pre-release: публикует его человек после проверки
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($changelog, [Predicate[string]] { param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "В CHANGELOG.md нет раздела версии $version" }
          $notes = @()
          for ($i = $start + 1; $i -lt $changelog.Count -and -not $changelog[$i].StartsWith('## [') -and $changelog[$i] -notmatch '^\[[^\]]+\]: '; $i++) { $notes += $changelog[$i] }
          $notes += ''
          $notes += '### Установка'
          $notes += ''
          $notes += 'Установщик: RevitTestHost-Addin-<версия>.msi ставит надстройку для текущего пользователя (без прав администратора) в `%AppData%\Autodesk\Revit\Addins\<год>\` для каждого установленного Revit 2020-2027.'
          $notes += ''
          $notes += 'Вручную: возьмите архив RevitTestHost-Addin-<версия>-Revit<год>.zip для вашего года и распакуйте его в `%ProgramData%\Autodesk\Revit\Addins\<год>\` (для Revit 2027 в `%AppData%\Autodesk\Revit\Addins\2027\`). Живая проверка выполнена на Revit 2020, 2022, 2025 и 2027, остальные годы собираются, но не проверены вживую (см. docs/versions.md).'
          $notes | Set-Content -LiteralPath release-notes.md -Encoding UTF8
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release create $tag --draft --prerelease --title $tag --notes-file release-notes.md @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create завершился с кодом $LASTEXITCODE" }

      # Политика Trusted Publishing на nuget.org (владелец mahach) разрешает этому workflow только RevitTestHost.Sdk и RevitUITesting
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0 (= v1): стороннее действие с id-token, закреплено на коммите
        with:
          user: mahach

      # Пакеты берутся по версии из тега: если Directory.Build.props не совпадает с тегом, файла нет и ничего не публикуется
      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($id in 'RevitTestHost.Sdk', 'RevitUITesting') {
            $package = Join-Path artifacts "$id.$version.nupkg"
            if (-not (Test-Path -LiteralPath $package)) { throw "Нет пакета $($package): версия в Directory.Build.props не совпадает с тегом?" }
            dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push $id завершился с кодом $LASTEXITCODE" }
          }
